components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
        school_class:
          type: integer
        title:
          type: string
          maxLength: 200
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - school_class
      - title
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school_class:
          type: integer
        teacher:
          type: integer
        title:
          type: string
          maxLength: 200
        description:
          type: string
        due_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - due_date
      - id
      - school_class
      - title
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        school_class:
          type: integer
        attendance_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
      required:
      - id
      - school_class
      - student
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - late
      - excused
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `late` - Late
        * `excused` - Excused
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 100
        entity:
          type: string
          maxLength: 100
        entity_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        ip_address:
          type: string
          nullable: true
        user:
          type: integer
          nullable: true
      required:
      - action
      - entity
      - id
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        school_class:
          type: integer
        enrolled_at:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/EnrollmentStatusEnum'
      required:
      - id
      - school_class
      - student
    EnrollmentStatusEnum:
      enum:
      - active
      - dropped
      - completed
      type: string
      description: |-
        * `active` - Active
        * `dropped` - Dropped
        * `completed` - Completed
    Grade:
      type: object
      description: What a teacher or admin sends to grade a submission.
      properties:
        grade:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        feedback:
          type: string
    LiveSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        school_class:
          type: integer
        teacher:
          type: integer
        title:
          type: string
          maxLength: 200
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        meeting_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/LiveSessionStatusEnum'
      required:
      - end_time
      - id
      - school_class
      - start_time
      - title
    LiveSessionStatusEnum:
      enum:
      - scheduled
      - live
      - ended
      - cancelled
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `live` - Live
        * `ended` - Ended
        * `cancelled` - Cancelled
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        title:
          type: string
          maxLength: 200
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - title
      - user
    PaginatedAnnouncementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
    PaginatedAssignmentList:
      type: object
      required:
      - count
      - results
